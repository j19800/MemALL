name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov flake8 mypy
      - name: Lint with flake8
        run: |
          # Fail only on real problems (syntax errors, undefined names); the
          # legacy style debt (long lines etc.) is tracked separately.
          flake8 src/memall/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with pytest (coverage gate)
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=src/memall --cov-report=term-missing --cov-fail-under=35
      - name: Type check with mypy
        continue-on-error: true
        run: |
          mypy src/memall/ --ignore-missing-imports --follow-imports=silent --python-version 3.10